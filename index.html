<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scribes Guild | S.E.E.</title>
    <style>
        :root { --primary: #3498db; --dark: #2c3e50; --gold: #f39c12; --bg: #f4f4f9; --success: #2ecc71; --sidebar-w: 260px; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); margin: 0; padding: 0; color: #333; }
        
        /* WELCOME & HEADER */
        #welcome-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 5000; text-align: center; padding: 20px; box-sizing: border-box; }
        .start-btn { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 30px; font-weight: bold; cursor: pointer; }
        .header { background: var(--dark); color: white; padding: 10px 20px; display: none; justify-content: space-between; align-items: center; height: 60px; position: sticky; top: 0; z-index: 1000; }

        /* PROGRESS BAR STYLES */
        .progress-wrapper { margin-bottom: 20px; }
        .progress-text { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: bold; margin-bottom: 5px; color: var(--dark); }
        .progress-outer { background: #dfe6e9; border-radius: 10px; height: 12px; width: 100%; overflow: hidden; border: 1px solid #d1d8e0; }
        .progress-inner { background: var(--success); height: 100%; width: 0%; transition: width 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 0 10px rgba(46, 204, 113, 0.3); }

        /* SIDEBAR */
        .sidebar { position: fixed; left: -260px; top: 0; width: var(--sidebar-w); height: 100%; background: white; box-shadow: 5px 0 15px rgba(0,0,0,0.2); transition: 0.3s ease; z-index: 3000; padding-top: 20px; }
        .sidebar.open { left: 0; }
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 2500; }
        .sidebar-overlay.active { display: block; }
        .nav-link { display: block; padding: 15px 25px; color: var(--dark); text-decoration: none; font-weight: 600; cursor: pointer; border-bottom: 1px solid #eee; }

        /* MAIN CONTENT */
        .main-content { padding: 20px; max-width: 600px; margin: 0 auto; display: none; }
        .view { display: none; }
        .view.active { display: block !important; }
        .card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .mission-text { background: #e8f4f8; padding: 20px; border-radius: 10px; border-left: 5px solid var(--primary); margin: 15px 0; font-style: italic; line-height: 1.6; }
        textarea { width: 100%; height: 120px; margin-bottom: 15px; padding: 12px; box-sizing: border-box; border-radius: 10px; border: 1px solid #ccc; font-size: 1rem; resize: none; }
        .btn-submit { background: var(--primary); color: white; border: none; width: 100%; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        
        .ledger-row { padding: 15px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .bonus-tag { color: var(--gold); font-size: 0.7rem; font-weight: bold; border: 1px solid var(--gold); padding: 2px 6px; border-radius: 4px; margin-left: 5px; }
    </style>
</head>
<body>

<div id="welcome-view">
    <h1>Welcome, Scribe.</h1>
    <p>Complete 5 missions today to earn your 25pt Equity Bonus.</p>
    <button class="start-btn" onclick="enterApp()">I'm Ready</button>
</div>

<div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>
<div class="sidebar" id="sidebar">
    <div style="padding: 20px; font-weight: bold; border-bottom: 1px solid #eee;">Scribes Menu</div>
    <div class="nav-link" onclick="switchView('mission')">🎯 Missions</div>
    <div class="nav-link" onclick="switchView('ledger')">📜 My Ledger</div>
    <div style="padding: 20px 25px; font-size: 0.7rem; color: #999;">SECTORS</div>
    <div class="nav-link" onclick="changeSector('General', 0)">🌐 General</div>
    <div class="nav-link" onclick="changeSector('Medical', 50)">🏥 Medical (50+)</div>
</div>

<div class="header" id="app-header">
    <button onclick="toggleSidebar()" style="background:none; border:none; color:white; font-size:1.8rem; cursor:pointer;">☰</button>
    <div style="font-weight: bold; color: var(--gold);"><span id="equity-balance">0</span> Equity</div>
</div>
