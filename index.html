<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill-Equity Exchange | Scribes Guild</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f4f9; padding: 2rem; color: #333; }
        .card { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; position: relative; }
        .stats-bar { display: flex; justify-content: space-between; background: #2c3e50; color: white; padding: 10px 15px; border-radius: 5px; margin-bottom: 1.5rem; font-size: 0.85rem; }
        .mission-box { background: #e8f4f8; padding: 1.5rem; border-left: 4px solid #3498db; margin-bottom: 1rem; }
        textarea { width: 100%; height: 120px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 1rem; font-family: inherit; box-sizing: border-box; }
        
        /* BUTTONS */
        .btn-main { background: #3498db; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-hint { background: #f39c12; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 0.8rem; margin-bottom: 10px; }
        
        /* HINT POPUP */
        #hint-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .hint-modal { background: white; padding: 1.5rem; border-radius: 8px; max-width: 300px; text-align: center; border-top: 5px solid #f39c12; }
        
        /* VAULT */
        .vault { background: #fff3cd; padding: 10px; border-radius: 5px; font-size: 0.8rem; margin-bottom: 1rem; display: none; }
    </style>
</head>
<body>

<div id="hint-overlay">
    <div class="hint-modal">
        <h3>Mission Intel</h3>
        <p id="hint-text-popup"></p>
        <button onclick="closeHint()" style="background:#7f8c8d; color:white; border:none; padding:5px 15px; border-radius:4px; cursor:pointer;">Close & Continue</button>
    </div>
</div>

<div class="card">
    <div class="stats-bar">
        <span>Rank: <strong id="user-rank">Novice</strong></span>
        <span>EQUITY: <strong id="equity-balance">0</strong> pts</span>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <h1>Mission 001</h1>
        <span style="font-size: 0.8rem; color: #7f8c8d;">Reward: <strong id="potential-reward">10</strong> pts</span>
    </div>
    
    <div class="mission-box">
        <em id="mission-display">"The municipal water repository will undergo prophylactic chlorination procedures to mitigate pathogenic proliferation."</em>
    </div>

    <button class="btn-hint" id="hint-btn" onclick="buyHint()">Unlock Hint (Cost: <span id="hint-cost">3</span> pts)</button>
    
    <div id="hint-vault" class="vault">
        <strong>Unlocked Intel:</strong> <div id="vault-contents"></div>
    </div>

    <textarea id="submission-box" placeholder="Enter human translation..."></textarea>
    <button class="btn-main" onclick="submitWork()">Submit to Ledger</button>
    <p id="status-message" style="font-weight: bold; margin-top: 10px;"></p>
</div>

<script>
    // MISSION CONFIG
    const missionData = {
        reward: 15,
        hintCost: 4,
        hints: [
            "Prophylactic = Preventative",
            "Mitigate = Reduce/Lesson",
            "Pathogenic = Disease-causing"
        ]
    };

    let usedHintsCount = 0;
    let currentPotentialReward = missionData.reward;
    let unlockedHints = [];

    window.onload = () => { updateUI(); };

    function updateUI() {
        const totalPoints = parseInt(localStorage.getItem('equityPoints') || 0);
        document.getElementById('equity-balance').innerText = totalPoints;
        document.getElementById('potential-reward').innerText = currentPotentialReward;
        document.getElementById('hint-cost').innerText = missionData.hintCost;
        
        // Ranking Logic
        let rank = "Novice Scribe";
        if (totalPoints >= 100) rank = "Journeyman";
        if (totalPoints >= 300) rank = "Master Scribe";
        document.getElementById('user-rank').innerText = rank;

        // Hint Button State
        if (usedHintsCount >= missionData.hints.length) {
            document.getElementById('hint-btn').innerText = "No more hints available";
            document.getElementById('hint-btn').disabled = true;
            document.getElementById('hint-btn').style.opacity = "0.5";
        }
    }

    function buyHint() {
        if (usedHintsCount < missionData.hints.length) {
            const newHint = missionData.hints[usedHintsCount];
            unlockedHints.push(newHint);
            
            // Subtract from current mission reward
            currentPotentialReward = Math.max(0, currentPotentialReward - missionData.hintCost);
            usedHintsCount++;

            // Show Popup
            document.getElementById('hint-text-popup').innerText = newHint;
            document.getElementById('hint-overlay').style.display = 'flex';

            // Add to Vault (Accessibility)
            document.getElementById('hint-vault').style.display = 'block';
            const hintDiv = document.createElement('div');
            hintDiv.innerText = "• " + newHint;
            document.getElementById('vault-contents').appendChild(hintDiv);

            updateUI();
        }
    }

    function closeHint() {
        document.getElementById('hint-overlay').style.display = 'none';
    }

    function submitWork() {
        const text = document.getElementById('submission-box').value;
        const status = document.getElementById('status-message');

        if (text.length < 15) { status.innerText = "Too short."; return; }

        // Send to Sheets (Using your provided link)
        const formURL = "https://docs.google.com/forms/d/e/1FAIpQLSc3kFyW7SM4cySwOCm8gfPnWDbW6XFJoXEJlrdqOlcwRzd6XA/formResponse";
        const formData = new FormData();
        formData.append("entry.337638736", "Human_User");
        formData.append("entry.1381339047", text);

        status.innerText = "⏳ Recording contribution...";

        fetch(formURL, { method: "POST", mode: "no-cors", body: formData })
        .then(() => {
            let total = parseInt(localStorage.getItem('equityPoints') || 0);
            total += currentPotentialReward;
            localStorage.setItem('equityPoints', total);
            
            status.style.color = "#27ae60";
            status.innerText = `✅ Success! +${currentPotentialReward} Equity Points.`;
            
            // RESET for next mission
            document.getElementById('submission-box').value = "";
            currentPotentialReward = missionData.reward;
            usedHintsCount = 0;
            document.getElementById('vault-contents').innerHTML = "";
            document.getElementById('hint-vault').style.display = 'none';
            updateUI();
        });
    }
</script>
</body>
</html>
